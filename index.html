<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PDF 자료 기반 AI 학습 튜터" />
    <meta name="theme-color" content="#20263A" />
    <meta property="og:title" content="으뜸" />
    <meta property="og:description" content="PDF 자료 기반 AI 학습 튜터" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.uteum.com/" />
    <link rel="canonical" href="https://www.uteum.com/" />
    <style>
      #app-bootstrap-loading {
        align-items: center;
        background: #f6f7f9;
        color: #171a22;
        display: flex;
        font-family: Pretendard, system-ui, sans-serif;
        inset: 0;
        justify-content: center;
        min-height: 100vh;
        position: fixed;
      }

      #app-bootstrap-loading > div {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #app-bootstrap-loading strong {
        font-size: 18px;
      }

      #app-bootstrap-loading span {
        color: #8a90a0;
        font-size: 14px;
      }

      #app-bootstrap-loading p {
        color: #6e7382;
        font-size: 14px;
        margin: 0;
        text-align: center;
      }

      #app-bootstrap-loading button {
        background: #20263a;
        border: 0;
        border-radius: 8px;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        min-height: 40px;
        padding: 0 16px;
      }

      #app-bootstrap-loading button:hover {
        background: #10141f;
      }

      #app-bootstrap-loading i {
        animation: app-loading-spin 0.8s linear infinite;
        border: 2px solid #e3e6ee;
        border-radius: 50%;
        border-top-color: #20263a;
        height: 22px;
        width: 22px;
      }

      @keyframes app-loading-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-bootstrap-loading i { animation: none; }
      }
    </style>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2320263A'/%3E%3Cpath d='M9 10.5c2.4-1.4 4.6-1.4 7 0 2.4-1.4 4.6-1.4 7 0v11c-2.4-1.4-4.6-1.4-7 0-2.4-1.4-4.6-1.4-7 0z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M16 10.5v11' stroke='white' stroke-width='2'/%3E%3C/svg%3E"
    />
    <title>으뜸</title>
  </head>
  <body>
    <div id="root">
      <div id="app-bootstrap-loading" aria-live="polite" role="status">
        <div>
          <strong>으뜸</strong>
          <i aria-hidden="true"></i>
          <span>서비스를 불러오는 중입니다.</span>
        </div>
      </div>
    </div>
    <script>
      ;(() => {
        const reloadStorageKey = 'uteum:entry-reload-at'
        const reloadCooldownMs = 60_000
        const reloadQueryKey = '__uteum_reload'

        const getLoadingElement = () =>
          document.getElementById('app-bootstrap-loading')

        const getFreshUrl = () => {
          const url = new URL(window.location.href)
          url.searchParams.set(reloadQueryKey, String(Date.now()))
          return url.toString()
        }

        const showRetry = () => {
          const loadingElement = getLoadingElement()
          if (!loadingElement) return

          const content = document.createElement('div')
          const title = document.createElement('strong')
          const description = document.createElement('p')
          const retryButton = document.createElement('button')

          title.textContent = '서비스를 불러오지 못했습니다.'
          description.textContent =
            '이전 버전의 파일이 남아 있을 수 있습니다. 다시 시도해 주세요.'
          retryButton.textContent = '다시 시도'
          retryButton.type = 'button'
          retryButton.addEventListener('click', () => {
            window.location.replace(getFreshUrl())
          })

          content.append(title, description, retryButton)
          loadingElement.replaceChildren(content)
          loadingElement.setAttribute('role', 'alert')
        }

        window.__uteumEntryLoadFailed = () => {
          if (!getLoadingElement()) return

          const now = Date.now()
          let lastReloadAt = 0

          try {
            lastReloadAt =
              Number(window.sessionStorage.getItem(reloadStorageKey)) || 0
          } catch {
            // A visible retry action still works when storage is unavailable.
          }

          if (now - lastReloadAt < reloadCooldownMs) {
            showRetry()
            return
          }

          try {
            window.sessionStorage.setItem(reloadStorageKey, String(now))
          } catch {
            // The cache-busting URL is sufficient for a single recovery attempt.
          }

          window.location.replace(getFreshUrl())
        }

        window.addEventListener(
          'error',
          (event) => {
            if (event.target instanceof HTMLScriptElement) {
              window.__uteumEntryLoadFailed()
            }
          },
          true,
        )
        window.setTimeout(window.__uteumEntryLoadFailed, 10_000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
