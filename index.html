<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PDF 자료 기반 AI 학습 튜터" />
    <meta name="theme-color" content="#4059d6" />
    <meta property="og:title" content="으뜸" />
    <meta property="og:description" content="PDF 자료 기반 AI 학습 튜터" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://uteum.com" />
    <link rel="canonical" href="https://uteum.com" />
    <style>
      #app-bootstrap-loading {
        align-items: center;
        background: #fff;
        color: #1c1917;
        display: flex;
        font-family: Pretendard, system-ui, sans-serif;
        inset: 0;
        justify-content: center;
        min-height: 100vh;
        position: fixed;
      }

      #app-bootstrap-loading > div {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #app-bootstrap-loading strong {
        font-size: 18px;
      }

      #app-bootstrap-loading span {
        color: #78716c;
        font-size: 14px;
      }

      #app-bootstrap-loading i {
        animation: app-loading-spin 0.8s linear infinite;
        border: 2px solid #e7e5e4;
        border-radius: 50%;
        border-top-color: #4059d6;
        height: 22px;
        width: 22px;
      }

      @keyframes app-loading-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-bootstrap-loading i { animation: none; }
      }
    </style>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234059d6'/%3E%3Cpath d='M9 10.5c2.4-1.4 4.6-1.4 7 0 2.4-1.4 4.6-1.4 7 0v11c-2.4-1.4-4.6-1.4-7 0-2.4-1.4-4.6-1.4-7 0z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M16 10.5v11' stroke='white' stroke-width='2'/%3E%3C/svg%3E"
    />
    <title>으뜸</title>
  </head>
  <body>
    <div id="root">
      <div id="app-bootstrap-loading" role="status">
        <div>
          <strong>으뜸</strong>
          <i aria-hidden="true"></i>
          <span>서비스를 불러오는 중입니다.</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
