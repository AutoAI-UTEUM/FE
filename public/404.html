<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#20263A" />
    <title>페이지를 찾을 수 없습니다 · 으뜸</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: #f6f7f9;
        color: #171a22;
        display: flex;
        font-family: Pretendard, system-ui, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        max-width: 420px;
        text-align: center;
      }

      strong {
        color: #8a90a0;
        display: block;
        font-size: 14px;
        margin-bottom: 12px;
      }

      h1 {
        font-size: 24px;
        margin: 0;
      }

      p {
        color: #6e7382;
        font-size: 15px;
        line-height: 1.6;
        margin: 12px 0 24px;
      }

      a {
        align-items: center;
        background: #20263a;
        border-radius: 8px;
        color: #fff;
        display: inline-flex;
        font-size: 14px;
        font-weight: 600;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        text-decoration: none;
      }

      a:hover {
        background: #10141f;
      }
    </style>
  </head>
  <body>
    <main>
      <strong>404</strong>
      <h1>페이지를 찾을 수 없습니다.</h1>
      <p>주소가 올바른지 확인하거나 으뜸 홈에서 다시 시작해 주세요.</p>
      <a href="https://www.uteum.com/">홈으로 이동</a>
    </main>
  </body>
</html>
