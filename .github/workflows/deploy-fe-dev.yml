# Required dev environment Secrets: DEV_SSH_HOST / DEV_SSH_USER / DEV_SSH_KEY
# Encrypted SSH keys also require DEV_SSH_PASSPHRASE in the dev environment.
# Keep repository SSH secrets unchanged: production currently shares them.
name: Deploy FE dev

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-fe-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy-fe-dev
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    env:
      VITE_API_BASE_URL: /api
      VITE_API_CAPABILITIES: reports,password-reset,exam-attempt-drafts,exam-learner-regrade,policy-consent
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      VITE_AUTH_CONTRACT_READINESS: be-auth-ee69e425-v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # Baseline unit fixtures set their own readiness; ON is covered below.
        env:
          VITE_AUTH_CONTRACT_READINESS: ''
        run: npm run test:run

      - name: Validate auth contract readiness
        shell: bash
        run: test "${VITE_AUTH_CONTRACT_READINESS:-}" = "be-auth-ee69e425-v1"

      - name: Install smoke browser
        run: npx playwright install --with-deps chromium

      - name: Synthetic ready email contract acceptance
        env:
          QA_ENV: mock
          QA_AUTH_CONTRACT_READINESS: be-auth-ee69e425-v1
        run: npx playwright test --config playwright.launch-auth.config.ts

      - name: Build
        run: npm run build

      - name: Generate public update snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/generate-updates-snapshot.mjs

      - name: Resolve expected entry asset
        id: build_metadata
        shell: bash
        run: |
          set -euo pipefail
          entry_asset="$({
            sed -nE 's#.*<script[^>]+src="([^"]+)"[^>]*></script>.*#\1#p' dist/index.html
          } | head -n 1)"
          test -n "$entry_asset"
          if [[ "$entry_asset" != /* ]]; then
            entry_asset="/$entry_asset"
          fi
          echo "entry_asset=$entry_asset" >> "$GITHUB_OUTPUT"

      - name: Copy dist to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          passphrase: ${{ secrets.DEV_SSH_PASSPHRASE }}
          source: dist/*
          target: /tmp/fe-dist
          strip_components: 1
          rm: true
          overwrite: true

      - name: Apply to frontend volume
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          passphrase: ${{ secrets.DEV_SSH_PASSPHRASE }}
          script: |
            set -eu
            test -f /tmp/fe-dist/index.html
            docker run --rm \
              -v edupilot-frontend-static:/html \
              -v /tmp/fe-dist:/src:ro \
              alpine sh -c "set -eu; mkdir -p /html/assets; find /html -mindepth 1 -maxdepth 1 ! -name assets -exec rm -rf {} +; cp -r /src/* /html/; find /html/assets -type f -mtime +30 -delete"
            rm -rf /tmp/fe-dist

      - name: Smoke test
        shell: bash
        env:
          EXPECTED_ENTRY: ${{ steps.build_metadata.outputs.entry_asset }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 6); do
            live_html="$(curl --fail --silent --show-error \
              -H 'Cache-Control: no-cache' \
              "https://dev.uteum.com/?deploy=${GITHUB_SHA}&attempt=${attempt}")"
            if printf '%s' "$live_html" | grep --fixed-strings --quiet "$EXPECTED_ENTRY"; then
              curl --fail --silent --show-error \
                "https://dev.uteum.com${EXPECTED_ENTRY}" > /dev/null
              intro_html="$(curl --fail --silent --show-error "https://dev.uteum.com/intro/")"
              printf '%s' "$intro_html" | grep --fixed-strings --quiet "$EXPECTED_ENTRY"
              for image in learning quiz feedback; do
                curl --fail --silent --show-error \
                  "https://dev.uteum.com/intro/${image}.webp" > /dev/null
              done
              echo "FE deployed with expected entry: $EXPECTED_ENTRY"
              exit 0
            fi
            echo "Smoke attempt $attempt/6 failed: expected $EXPECTED_ENTRY"
            sleep 5
          done
          exit 1

      - name: Smoke test active email confirmation UI
        env:
          EMAIL_SMOKE_BASE_URL: https://dev.uteum.com
          EXPECTED_ENTRY: ${{ steps.build_metadata.outputs.entry_asset }}
        run: node scripts/smoke-email-verification.mjs
