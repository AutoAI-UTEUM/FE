name: Frontend CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  launch-auth-contract:
    name: launch-auth-contract (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - mode: default-off
            readiness: ''
          - mode: synthetic-ready
            readiness: be-auth-ee69e425-v1
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Synthetic local browser contract acceptance
        env:
          QA_ENV: mock
          QA_AUTH_CONTRACT_READINESS: ${{ matrix.readiness }}
        run: npx playwright test --config playwright.launch-auth.config.ts
      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-auth-contract-${{ matrix.mode }}
          path: qa-artifacts/launch-auth/
          retention-days: 7

  quality:
    name: frontend-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_API_BASE_URL: /api
      VITE_API_CAPABILITIES: reports,policy-consent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

  auth-browser-regressions:
    name: auth-browser-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check native multi-tab authentication with local mock APIs
        run: npm run test:e2e:mock -- e2e/auth-multitab.spec.ts --project chromium-1440 --workers 1

      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-browser-regressions
          path: qa-artifacts/mock/
          retention-days: 7
